name: Pruebas de RadicaCuentas
on:
  push:
    branches: ["feature/state-based-queues-20261124"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Dependencias
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Compilación estática
        run: python -m compileall -q app migrations tests
      - name: Pruebas unitarias e integrales
        run: pytest -q
