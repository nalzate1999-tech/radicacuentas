# Blueprint oficial de Render. El archivo de datos NO debe subirse al repositorio.
databases:
  - name: radicacion-postgresql
    plan: 0.5c-1g
    postgresMajorVersion: '17'
    databaseName: radicacion
    user: radicacion
    diskSizeGB: 15
    ipAllowList: []
services:
  - type: web
    name: radicacion-cuentas
    runtime: docker
    plan: 1c-2g
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: radicacion-postgresql
          property: connectionString
      - key: APP_ENV
        value: production
      - key: SESSION_HTTPS_ONLY
        value: '1'
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"
      - key: APP_URL
        sync: false
      - key: NOTIFICATIONS_ENABLED
        value: '0'
